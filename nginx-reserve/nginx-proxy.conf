server {
    listen 81;

    # ── Tu web (nginx_server) ──────────────────
    # Acceso: http://localhost:1027/web/
    location /web/ {
        proxy_pass http://nginx:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Orion Context Broker ───────────────────
    # Acceso: http://localhost:1027/orion/
    location /orion/ {
        proxy_pass http://orion:1026/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── FastAPI ────────────────────────────────
    # Acceso: http://localhost:1027/api/
    location /api/ {
        proxy_pass http://fastapi:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Añadir más apps aquí ───────────────────
    # location /nueva-app/ {
    #     proxy_pass http://nombre-contenedor:puerto/;
    # }
}